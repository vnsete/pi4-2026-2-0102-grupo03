server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://backend-1:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api2/ {
    proxy_pass http://backend-2:8081/;
    proxy_set_header Host $host;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
